name: exstreak
description: "ExStreak - build unbreakable training habits with streaks, goals and progress tracking."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (offline-first, relational)
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Routing
  go_router: ^17.5.0

  # Charts
  fl_chart: ^1.2.0

  # Notifications / reminders
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Platform / utilities
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  collection: ^1.19.1
  wakelock_plus: ^1.7.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  proximity_sensor: ^2.0.0
  flutter_tts: ^4.2.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900

# ---------------------------------------------------------------------------
# Branding assets are generated from these single sources of truth.
# Regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0B0B0F"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0B0F"
  image: "assets/branding/splash.png"
  android_12:
    image: "assets/branding/splash_android12.png"
    color: "#0B0B0F"
    icon_background_color: "#0B0B0F"
  android: true
  ios: false
  web: false
